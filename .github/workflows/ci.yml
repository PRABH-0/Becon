name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI (Python 3.12 - SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt

      - name: Run Ruff Lint Check
        run: ruff check app/ tests/

      - name: Run Pytest Suite (SQLite)
        run: pytest tests/ -v

  postgres:
    name: PostgreSQL CI & Migrations (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: becon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/becon_test
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/becon_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt

      - name: Run Alembic Upgrade Head on PostgreSQL
        run: alembic upgrade head

      - name: Run Pytest Suite with PostgreSQL (including RLS & migrations)
        run: pytest tests/ -v

  frontend:
    name: Frontend CI (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_SUPABASE_URL: https://dummy-ci-project.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy-ci-anon-key
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      # TODO (ROADMAP Task 6.3 / 1.8: Refactor remaining React hook effects & explicit any types, then remove continue-on-error). Baseline after 1.6 trivial cleanup: 16 problems (12 errors, 4 warnings).
      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Run Frontend Tests
        run: npm test

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build
